[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# SMODS.reset_blind_choices
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_objects/blind.lua"]'
pattern = "choices[k] = SMODS.get_new_blind(string.lower(k))"
position = "at"
match_indent = true
payload = '''
if G.GAME.modifiers.boss_rush then
    choices[k] = SMODS.get_new_blind("boss")
elseif G.GAME.modifiers.start_rebellion or #SMODS.find_card("j_manifold_rebellion") % 2 == 1 then
    if k == "Small" then
        choices[k] = SMODS.get_new_blind("boss")
    elseif k == "Boss" then
        choices[k] = SMODS.get_new_blind("small")
    else
        choices[k] = SMODS.get_new_blind("big")
    end
else
    choices[k] = SMODS.get_new_blind(string.lower(k))
end
'''

# Blind:set_blind
[[patches]]
[patches.pattern]
target = "blind.lua"
pattern = '''
self[self.current_slot or ''] = nil
local current_type = string.lower(G.GAME.blind_on_deck or '')
self[current_type] = blind and true or nil
self.current_slot = current_type
'''
position = "at"
match_indent = true
payload = '''
self.boss = blind and not not blind.boss
'''

# G.FUNCS.reroll_boss
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.CONTROLLER.locks.boss_reroll = true"
position = "after"
match_indent = true
payload = '''
local target_u = "Small"
if G.P_BLINDS[G.GAME.round_resets.blind_choices.Boss].boss then
    target_u = "Boss"
elseif G.P_BLINDS[G.GAME.round_resets.blind_choices.Big].boss then
    target_u = "Big"
end
local target = target_u:lower()
'''

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
G.blind_select_opts.boss:set_role({xy_bond = 'Weak'})
G.blind_select_opts.boss.alignment.offset.y = 20
'''
position = "at"
match_indent = true
payload = '''
G.blind_select_opts[target]:set_role{xy_bond = "Weak"}
G.blind_select_opts[target].alignment.offset.y = 20
'''

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
local par = G.blind_select_opts.boss.parent
G.GAME.round_resets.blind_choices.Boss = get_new_boss()

G.blind_select_opts.boss:remove()
G.blind_select_opts.boss = UIBox{
'''
position = "at"
match_indent = true
payload = '''
local par = G.blind_select_opts[target].parent
G.GAME.round_resets.blind_choices[target_u] = get_new_boss()
G.blind_select_opts[target]:remove()
G.blind_select_opts[target] = UIBox{
'''

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''
par.config.object = G.blind_select_opts.boss
par.config.object:recalculate()
G.blind_select_opts.boss.parent = par
G.blind_select_opts.boss.alignment.offset.y = 0
'''
position = "at"
match_indent = true
payload = '''
par.config.object = G.blind_select_opts[target]
par.config.object:recalculate()
G.blind_select_opts[target].parent = par
G.blind_select_opts[target].alignment.offset.y = 0
'''

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "UIBox_dyn_container({create_UIBox_blind_choice('Boss')},false,get_blind_main_colour('Boss'), mix_colours(G.C.BLACK, get_blind_main_colour('Boss'), 0.8))"
position = "at"
match_indent = true
payload = '''
UIBox_dyn_container({create_UIBox_blind_choice(target_u)}, false, get_blind_main_colour(target_u), mix_colours(G.C.BLACK, get_blind_main_colour(target_u), 0.8))
'''

# end_round and new_round
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "if G.GAME.blind:get_type() == 'Boss' then"
position = "at"
match_indent = true
payload = '''
if G.GAME.blind_on_deck == "Boss" then
'''

# create_UIBox_blind_choice
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling"
position = "after"
match_indent = true
payload = '''
local blind_type = "Boss"
if blind_choice.config.small then
    blind_type = "Small"
elseif blind_choice.config.big then
    blind_type = "Big"
end
if blind_type == "Boss" then
    blind_amt = blind_amt * (G.GAME.modifiers.x_boss or 1)
else
    blind_amt = blind_amt * (G.GAME.modifiers.x_non_boss or 1)
end
'''

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "if G.GAME.modifiers.no_blind_reward and G.GAME.modifiers.no_blind_reward[type] then _reward = nil end"
position = "at"
match_indent = true
payload = '''
if G.GAME.modifiers.no_blind_reward and G.GAME.modifiers.no_blind_reward[blind_type] then _reward = nil end
'''