[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[vars]
pip_text = '''
local rankless = specific_vars.value == "manifold_none"
local suitless = specific_vars.suit == "manifold_nothing"
local wild = specific_vars.suit == "manifold_wild"
local deity = specific_vars.value == "manifold_deity"
if rankless then
    if suitless then
        localize{type = "other", key = "rankless_suitless", nodes = desc_nodes, vars = {}}
    elseif wild then
        localize{type = "other", key = "rankless_wild", nodes = desc_nodes, vars = {}}
    else
        localize{type = "other", key = "rankless", nodes = desc_nodes, vars = {}}
    end
elseif deity then
    if suitless then
        localize{type = "other", key = "deity_suitless", nodes = desc_nodes, vars = {}}
    elseif wild then
        localize{type = "other", key = "deity_wild", nodes = desc_nodes, vars = {}}
    else
        localize{type = "other", key = "deity", nodes = desc_nodes, vars = {}}
    end
elseif suitless then
    localize{type = "other", key = "suitless", nodes = desc_nodes, vars = {}}
elseif wild then
    localize{type = "other", key = "wild", nodes = desc_nodes, vars = {}}
end
'''

# generate_card_ui
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if specific_vars.bonus_chips then"
position = "before"
match_indent = true
payload = '''
{{lovely:pip_text}}
'''

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if _c.effect == 'Mult Card' then loc_vars = {SMODS.signed(cfg.mult)}"
position = "before"
match_indent = true
payload = '''
if specific_vars and _c.name ~= "Stone Card" then
    {{lovely:pip_text}}
end
'''

# SMODS.Enhancement.generate_ui
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/game_object.lua"]'
pattern = "SMODS.Enhancement.super.generate_ui(self, info_queue, card, desc_nodes, specific_vars, full_UI_table)"
position = "before"
match_indent = true
payload = '''
if not (self.replace_base_card or specific_vars.debuffed) then
    {{lovely:pip_text}}
end
'''

# G.UIDEF.view_deck
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = "if rank_tallies[rank_name_mapping[i]] ~= 0 or SMODS.add_to_pool(SMODS.Ranks[rank_name_mapping[i]], { suit = '' }) then"
position = "at"
match_indent = true
payload = '''
if (rank_tallies[rank_name_mapping[i]] ~= 0 or SMODS.add_to_pool(SMODS.Ranks[rank_name_mapping[i]], {suit = ""})) and not SMODS.Ranks[rank_name_mapping[i]].hidden then
'''

# Move suits to end of suit list (deck views)
[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/overrides.lua"]'
pattern = "for i = #SMODS.Suit.obj_buffer, 1, -1 do"
position = "at"
match_indent = true
payload = '''
local buffer = SMODS.Suit.obj_buffer
for k, v in ipairs(buffer) do
    if v == "manifold_nothing" then
        table.insert(buffer, 1, table.remove(buffer, k))
        break
    end
end
for k, v in ipairs(buffer) do
    if v == "manifold_wild" then
        table.insert(buffer, 2, table.remove(buffer, k))
        break
    end
end
for i = #buffer, 1, -1 do
'''

# reset_castle_card
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not SMODS.has_no_suit(v) then"
position = "at"
match_indent = true
payload = '''
if not SMODS.has_no_suit(v) and not SMODS.has_any_suit(v) then
'''

# reset_mail_rank
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not SMODS.has_no_rank(v) then"
position = "at"
match_indent = true
payload = '''
if not SMODS.has_no_rank(v) and not MANIF.has_any_rank(v) then
'''